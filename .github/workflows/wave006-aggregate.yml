name: Wave006 Aggregate

on:
  push:
    branches: [main, 'eng/wave006-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave006-aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: python3 -m pip install --upgrade pip pytest
      - name: Validate Wave006 aggregate
        run: python3 scripts/engineering_wave006/validate_aggregate.py
      - name: Aggregate and closeout unit checks
        run: python3 -m pytest -q tests/engineering_wave006
