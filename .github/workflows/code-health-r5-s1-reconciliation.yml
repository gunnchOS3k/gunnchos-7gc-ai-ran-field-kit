name: Code Health R5 S1 Reconciliation

on:
  push:
    branches: [main, 'eng/code-health-r5-s1-reconciliation']
  pull_request:
    paths:
      - 'program/code_health_authenticity_baseline_v1/**'
      - 'scripts/validate_code_health_r5_s1_reconciliation.py'
      - 'tests/test_code_health_r5_s1_reconciliation.py'
      - '.github/workflows/code-health-r5-s1-reconciliation.yml'
  workflow_dispatch:

jobs:
  r5-s1-reconciliation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout field-kit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python3 -m pip install pytest

      - name: Checkout accepted portal main (PR #11 merge)
        uses: actions/checkout@v4
        with:
          repository: gunnchOS3k/gunnchos-research-portal
          ref: 2a3303d56a71c1f78bfbbf165ed75f1d368fa98f
          path: _siblings/gunnchos-research-portal
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout accepted WAIKE main (PR #55 merge)
        uses: actions/checkout@v4
        with:
          repository: gunnchOS3k/waike-research-ops
          ref: 8eb2827dc58ffa391842da1bfb1ee665c25a31a7
          path: _siblings/waike-research-ops
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Overlay unit tests
        run: python3 -m pytest -q tests/test_code_health_r5_s1_reconciliation.py

      - name: Independent reconciliation validator (+ sibling remediation recheck)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Live PR provenance via gh when available
          python3 scripts/validate_code_health_r5_s1_reconciliation.py \
            --portal-root _siblings/gunnchos-research-portal \
            --waike-root _siblings/waike-research-ops \
            --require-siblings
          test -f program/code_health_authenticity_baseline_v1/remediation_status/R5_S1_RECONCILIATION_VALIDATION.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("program/code_health_authenticity_baseline_v1/remediation_status/R5_S1_RECONCILIATION_VALIDATION.json").read_text())
          assert d["token"]=="CODE_HEALTH_R5_S1_ACCEPTED_MAIN_RECONCILIATION_PASS", d
          print("CODE_HEALTH_R5_S1_ACCEPTED_MAIN_RECONCILIATION_PASS")
          PY
