name: Standards Watch
on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 standards/validators/validate_standards_mapping.py
      - run: python3 scripts/validate_claim_firewall.py
      - run: python3 standards/watch/check_standards_sources.py
      - uses: actions/upload-artifact@v4
        with: {name: standards-watch, path: standards/watch/out/}
