name: Claim Firewall
on: [push, pull_request, workflow_dispatch]
jobs:
  firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: python -m pip install -U pip && python -m pip install pyyaml
      - run: python3 scripts/validate_claim_firewall.py
      - run: python3 scripts/validate_release_firewall.py
      - run: python3 scripts/validate_game_release_claims.py
      - run: python3 scripts/validate_factory_rma_support_stream.py
