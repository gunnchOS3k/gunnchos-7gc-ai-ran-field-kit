name: Engineering Wave014 Accepted-Main Closeout

on:
  push:
    branches: [main, 'eng/wave014-*']
  pull_request:
    paths:
      - 'artifacts/engineering_wave014/**'
      - 'artifacts/engineering_wave014_closeout/**'
      - 'scripts/engineering_wave014/**'
      - 'program/digital_ecosystem_baseline_v2/**'
      - 'tests/engineering_wave014/**'
      - '.github/workflows/engineering-wave014-accepted-main-closeout.yml'

jobs:
  wave014-accepted-main-closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pytest

      - name: Verify Anime Aggressors PR #84 provenance bindings in artifacts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          prov=json.loads(Path('artifacts/engineering_wave014_closeout/WAVE014_ACCEPTED_MAIN_PROVENANCE.json').read_text())
          assert prov['PR84_FINAL_HEAD_SHA']=='aa28654ff33cea28e79bf7d3941dfc3c81db50cc'
          assert prov['PR84_MERGE_SHA']=='706aba63274c9b563dfc34e76502d78a7cac19a9'
          assert prov['ANIME_ACCEPTED_MAIN_TREE']=='faa3ff384e74d715ff2159ccf3b182452a409d7f'
          assert prov['TREE_EQUIVALENCE_STATUS']=='TREE_EQUIVALENT_TO_PR84_FINAL_HEAD'
          assert prov['authoritative_premerge_ci']['run_id']==32604653603
          assert prov['authoritative_premerge_ci']['artifact_id']==9483927490
          wave=json.loads(Path('artifacts/engineering_wave014_closeout/_accepted_main_reproduction/WAVE014_RESULT.json').read_text())
          assert wave['ENGINEERING_WAVE_014']=='PASS'
          assert wave['PROCEDURAL_CHARACTER_RUNTIME_PASS'] is True
          print('provenance+accepted-main reproduction binding OK')
          PY

      - name: Wave014 accepted-main closeout integrity tests
        run: pytest tests/engineering_wave014/test_wave014_accepted_main_closeout.py -q

      - name: Field-kit register integrity
        run: python3 scripts/validate_baseline_v2_b4_register_integrity.py

      - name: Emit closeout token
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/engineering_wave014_closeout/WAVE014_ACCEPTED_MAIN_CLOSEOUT.json').read_text())
          assert d.get('token')=='ENGINEERING_WAVE_014_ACCEPTED_MAIN_CLOSEOUT_PASS'
          assert d.get('FORCED_ROW_CLOSURES')==0
          print('ENGINEERING_WAVE_014_ACCEPTED_MAIN_CLOSEOUT_PASS')
          PY
