name: Application readiness CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pytest jsonschema pyyaml

      - name: Mint portfolio GitHub App token (optional fallback)
        id: app-token
        uses: actions/create-github-app-token@v2
        continue-on-error: true
        with:
          app-id: ${{ secrets.PORTFOLIO_APP_ID }}
          private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
          owner: gunnchOS3k
          repositories: |
            gunnchos-emergent-service-intent-protocols
            gunnchos-gpu-nr-baseband-platform
            edge-io-measurement-node
            7gc-digital-twin
            spectrumx-ai-ran-gary
            ntn-resilience-sim
            readygary-6g-beam-selection
            gunnchos-hardware-industrial-design
            gunnchos-device-os

      - name: Resolve checkout credential
        id: creds
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_OUTCOME: ${{ steps.app-token.outcome }}
          PAT: ${{ secrets.PORTFOLIO_REPO_READ_TOKEN }}
          SSH_EMERGENT: ${{ secrets.PORTFOLIO_SSH_KEY_GUNNCHOS_EMERGENT_SERVICE_INTENT_PROTOCOLS }}
          SSH_GPU: ${{ secrets.PORTFOLIO_SSH_KEY_GUNNCHOS_GPU_NR_BASEBAND_PLATFORM }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +x
          # Prefer per-repo read-only SSH deploy keys for private siblings.
          if [ -n "${SSH_EMERGENT:-}" ] && [ -n "${SSH_GPU:-}" ]; then
            echo "credential_source=deploy_key" >> "$GITHUB_OUTPUT"
            # HTTPS token still used for public siblings (GITHUB_TOKEN is fine).
            if [ "${APP_OUTCOME}" = "success" ] && [ -n "${APP_TOKEN:-}" ]; then
              echo "token=${APP_TOKEN}" >> "$GITHUB_OUTPUT"
            elif [ -n "${PAT:-}" ]; then
              echo "token=${PAT}" >> "$GITHUB_OUTPUT"
            else
              echo "token=${GITHUB_TOKEN}" >> "$GITHUB_OUTPUT"
            fi
            echo "has_deploy_keys=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${APP_OUTCOME}" = "success" ] && [ -n "${APP_TOKEN:-}" ]; then
            echo "credential_source=github_app" >> "$GITHUB_OUTPUT"
            echo "token=${APP_TOKEN}" >> "$GITHUB_OUTPUT"
            echo "has_deploy_keys=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${PAT:-}" ]; then
            echo "credential_source=pat" >> "$GITHUB_OUTPUT"
            echo "token=${PAT}" >> "$GITHUB_OUTPUT"
            echo "has_deploy_keys=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: using PORTFOLIO_REPO_READ_TOKEN fallback (deploy keys preferred)"
            exit 0
          fi
          echo "credential_source=none" >> "$GITHUB_OUTPUT"
          echo "token=" >> "$GITHUB_OUTPUT"
          echo "has_deploy_keys=false" >> "$GITHUB_OUTPUT"
          echo "BLOCKED_CREDENTIAL_CONFIGURATION"
          echo "Configure PORTFOLIO_SSH_KEY_* deploy-key secrets (preferred) or PORTFOLIO_APP_ID + PORTFOLIO_APP_PRIVATE_KEY"
          echo "App mint outcome=${APP_OUTCOME}; do not fall back to interactive gh tokens"
          exit 3

      - name: Checkout locked sibling repositories
        env:
          PORTFOLIO_CHECKOUT_TOKEN: ${{ steps.creds.outputs.token }}
          PORTFOLIO_CREDENTIAL_SOURCE: ${{ steps.creds.outputs.credential_source }}
          PORTFOLIO_SSH_KEY_GUNNCHOS_EMERGENT_SERVICE_INTENT_PROTOCOLS: ${{ secrets.PORTFOLIO_SSH_KEY_GUNNCHOS_EMERGENT_SERVICE_INTENT_PROTOCOLS }}
          PORTFOLIO_SSH_KEY_GUNNCHOS_GPU_NR_BASEBAND_PLATFORM: ${{ secrets.PORTFOLIO_SSH_KEY_GUNNCHOS_GPU_NR_BASEBAND_PLATFORM }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/ci_checkout_locked_siblings.sh
          bash scripts/ci_checkout_locked_siblings.sh "$(dirname "$GITHUB_WORKSPACE")"

      - name: Unit and contract tests
        run: python -m pytest -q tests

      - name: Master status + preregistration + assignments
        run: |
          python scripts/validate_master_status.py
          python scripts/validate_preregistration.py
          python scripts/validate_pilot_assignments.py
          python scripts/validate_application_packet.py
          python scripts/validate_gate1_thesis.py

      - name: Repo lock integrity
        run: |
          python scripts/verify_repo_lock.py --repos-root "$(dirname "$GITHUB_WORKSPACE")" --allow-dirty
          python scripts/verify_repo_lock.py --repos-root "$(dirname "$GITHUB_WORKSPACE")"

      - name: Gate4 evaluation-ready dry-run
        run: |
          make gate4-evaluation-ready REPOS_ROOT="$(dirname "$GITHUB_WORKSPACE")"

      - name: Synthetic fixture separation check
        run: |
          python - <<'PY'
          from pathlib import Path
          bad=[]
          for p in Path('datasets/controlled/sanitized').rglob('*'):
            if p.is_file() and p.name != '.gitkeep':
              bad.append(str(p))
          for p in Path('datasets/controlled/raw-private').rglob('*'):
            if p.is_file() and p.name not in {'.gitkeep','README.md'}:
              bad.append(str(p))
          if bad:
              raise SystemExit('unexpected controlled files: '+str(bad))
          print('synthetic/private separation ok')
          PY

      - name: Outage metric + preregistration freeze
        run: |
          python -m pytest -q tests/evaluation/test_recovery_time_metric.py
          python scripts/validate_preregistration.py
          test -f evaluation/PREREGISTRATION_MANIFEST.json
          test -f evaluation/PREREGISTRATION_FREEZE_REPORT.md
          test -d evaluation/amendments/amendment_001

      - name: Paper build (pinned Tectonic)
        run: |
          bash scripts/build_paper.sh
          test -f paper/main.pdf
          test -f paper/PAPER_BUILD_REPORT.md
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('paper/PAPER_BUILD_MANIFEST.json').read_text())
          pages=int(m.get('page_count') or m.get('pages') or 0)
          if pages == 0:
              text=Path('paper/PAPER_BUILD_REPORT.md').read_text()
              import re
              m2=re.search(r'(\d+)\s*pages?', text, re.I)
              pages=int(m2.group(1)) if m2 else 0
          assert 6 <= pages <= 8, pages
          print('page_count', pages)
          PY

      - name: Release exclusion scan
        run: |
          bash release/build_release_archive.sh
          python - <<'PY'
          import tarfile, sys
          from pathlib import Path
          dists=sorted(Path('release/dist').glob('*.tar.gz'))
          assert dists, 'no archive'
          bad_parts=('raw-private','consent-summary','device-private','.env','credentials')
          with tarfile.open(dists[-1], 'r:gz') as tf:
              names=tf.getnames()
          hits=[n for n in names if any(b in n for b in bad_parts)]
          if hits:
              print('forbidden archive members', hits)
              sys.exit(2)
          print('archive members', len(names), 'ok')
          PY

      - name: Gate PASS without evidence must fail
        run: |
          python - <<'PY'
          import json, subprocess, sys, tempfile
          from pathlib import Path
          status=json.loads(Path('research-application-control/MASTER_STATUS.json').read_text())
          status['gates']['GATE_1_PASS']['evidence']=['missing_file_xyz.md']
          status['gates']['GATE_1_PASS']['unmet']=[]
          with tempfile.NamedTemporaryFile('w', suffix='.json', delete=False) as fh:
              json.dump(status, fh)
              path=fh.name
          proc=subprocess.run([sys.executable,'scripts/validate_master_status.py','--status',path], capture_output=True, text=True)
          assert proc.returncode != 0, proc.stdout
          print('forged PASS correctly rejected')
          PY
