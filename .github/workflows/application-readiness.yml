name: Application readiness CI

on:
  push:
    branches: [main, master, "cursor/**"]
  pull_request:

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pytest jsonschema pyyaml

      - name: Unit and contract tests
        run: python -m pytest -q tests

      - name: Master status + preregistration + assignments
        run: |
          python scripts/validate_master_status.py
          python scripts/validate_preregistration.py
          python scripts/validate_pilot_assignments.py
          python scripts/validate_application_packet.py
          python scripts/validate_gate1_thesis.py

      - name: Repo lock (siblings optional in CI)
        run: |
          # In CI only this repo is checked out; treat missing required siblings as documented skip
          python scripts/verify_repo_lock.py --repos-root .. || {
            echo "Repo-lock may fail in isolated CI without sibling checkouts; local make verify-repo-lock is authoritative.";
            # Soft-fail only when siblings absent
            python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          lock=json.loads(Path('integration/repo-lock.json').read_text())
          missing=[]
          for name, meta in (lock.get('components') or {}).items():
            if not meta.get('required', True):
              continue
            p=Path('..')/ (meta.get('path') or name)
            if not p.is_dir():
              missing.append(name)
          if missing:
            print('CI_SKIP_REPO_LOCK_MISSING', missing)
            sys.exit(0)
          sys.exit(2)
          PY
          }

      - name: Gate4 evaluation-ready dry-run
        run: |
          make gate4-evaluation-ready REPOS_ROOT=.. || echo "blocked_without_siblings"

      - name: Synthetic fixture separation check
        run: |
          python - <<'PY'
          from pathlib import Path
          bad=[]
          for p in Path('datasets/controlled/sanitized').rglob('*'):
            if p.is_file() and p.name != '.gitkeep':
              # tracked sanitized sessions must not appear in public tree
              bad.append(str(p))
          # raw-private must not have session payloads tracked
          for p in Path('datasets/controlled/raw-private').rglob('*'):
            if p.is_file() and p.name not in {'.gitkeep','README.md'}:
              bad.append(str(p))
          if bad:
              raise SystemExit('unexpected controlled files: '+str(bad))
          print('synthetic/private separation ok')
          PY

      - name: Recovery-time metric + preregistration freeze
        run: |
          python -m pytest -q tests/evaluation/test_recovery_time_metric.py
          python scripts/validate_preregistration.py
          test -f evaluation/PREREGISTRATION_MANIFEST.json
          test -f evaluation/PREREGISTRATION_FREEZE_REPORT.md

      - name: Paper build (pinned Tectonic)
        run: |
          bash scripts/build_paper.sh
          test -f paper/main.pdf
          test -f paper/PAPER_BUILD_REPORT.md

      - name: Release exclusion scan
        run: |
          bash release/build_release_archive.sh
          python - <<'PY'
          import tarfile, sys
          from pathlib import Path
          dists=sorted(Path('release/dist').glob('*.tar.gz'))
          assert dists, 'no archive'
          bad_parts=('raw-private','consent-summary','device-private','.env','credentials')
          with tarfile.open(dists[-1], 'r:gz') as tf:
              names=tf.getnames()
          hits=[n for n in names if any(b in n for b in bad_parts)]
          if hits:
              print('forbidden archive members', hits)
              sys.exit(2)
          print('archive members', len(names), 'ok')
          PY

      - name: Gate PASS without evidence must fail
        run: |
          python - <<'PY'
          import json, subprocess, sys, tempfile
          from pathlib import Path
          status=json.loads(Path('research-application-control/MASTER_STATUS.json').read_text())
          status['gates']['GATE_1_PASS']['evidence']=['missing_file_xyz.md']
          status['gates']['GATE_1_PASS']['unmet']=[]
          with tempfile.NamedTemporaryFile('w', suffix='.json', delete=False) as fh:
              json.dump(status, fh)
              path=fh.name
          proc=subprocess.run([sys.executable,'scripts/validate_master_status.py','--status',path], capture_output=True, text=True)
          assert proc.returncode != 0, proc.stdout
          print('forged PASS correctly rejected')
          PY
