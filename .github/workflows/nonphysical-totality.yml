name: Nonphysical totality CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nonphysical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install pyyaml jsonschema pytest
      - name: Validate nonphysical status axis
        run: python scripts/validate_nonphysical_status.py
      - name: Claim firewall
        run: python scripts/validate_claim_firewall.py
      - name: Physical freeze token present
        run: |
          grep -q 'PHYSICAL_EXECUTION_FREEZE = ACTIVE' program/reports/PHYSICAL_EXECUTION_FREEZE.md
          grep -q 'physical_execution_freeze: ACTIVE' program/nonphysical/gate_nonphysical_status.yaml
      - name: PHYSICAL_PENDING is valid nonphysical
        run: python scripts/validate_physical_pending_ok.py
      - name: Gate 2 nonphysical artifacts
        run: python scripts/validate_gate2_nonphysical.py
      - name: Gate 2 interference modeled check
        run: python gate2/nonphysical/G2_C1_enclosure/check_interference.py
      - name: Gate 2 unit tests
        run: python -m pytest -q gate2/nonphysical -q
      - name: Gate 3 nonphysical artifacts
        run: python scripts/validate_gate3_nonphysical.py
      - name: Gate 3 unit tests
        run: python -m pytest -q gate3/nonphysical -q
