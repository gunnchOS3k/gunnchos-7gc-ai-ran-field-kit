name: Nonphysical totality CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nonphysical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install pyyaml jsonschema
      - name: Validate nonphysical status axis
        run: python scripts/validate_nonphysical_status.py
      - name: Validate ecosystem version lock
        run: python scripts/validate_ecosystem_version_lock.py
      - name: Claim firewall
        run: python scripts/validate_claim_firewall.py
      - name: Physical freeze token present
        run: |
          grep -q 'PHYSICAL_EXECUTION_FREEZE = ACTIVE' program/reports/PHYSICAL_EXECUTION_FREEZE.md
          grep -q 'physical_execution_freeze: ACTIVE' program/nonphysical/gate_nonphysical_status.yaml
