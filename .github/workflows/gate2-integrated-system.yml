name: Gate 2 Integrated System

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gunnchos-7gc-ai-ran-field-kit
    steps:
      - name: Checkout field-kit
        uses: actions/checkout@v4
        with:
          path: gunnchos-7gc-ai-ran-field-kit

      - name: Mint portfolio GitHub App token (optional fallback)
        id: app-token
        uses: actions/create-github-app-token@v2
        continue-on-error: true
        with:
          app-id: ${{ secrets.PORTFOLIO_APP_ID }}
          private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
          owner: gunnchOS3k
          repositories: |
            gunnchos-emergent-service-intent-protocols
            gunnchos-gpu-nr-baseband-platform
            edge-io-measurement-node
            7gc-digital-twin
            spectrumx-ai-ran-gary
            ntn-resilience-sim
            readygary-6g-beam-selection
            gunnchos-hardware-industrial-design
            gunnchos-device-os

      - name: Resolve checkout credential
        id: creds
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_OUTCOME: ${{ steps.app-token.outcome }}
          PAT: ${{ secrets.PORTFOLIO_REPO_READ_TOKEN }}
          SSH_EMERGENT: ${{ secrets.PORTFOLIO_SSH_KEY_GUNNCHOS_EMERGENT_SERVICE_INTENT_PROTOCOLS }}
          SSH_GPU: ${{ secrets.PORTFOLIO_SSH_KEY_GUNNCHOS_GPU_NR_BASEBAND_PLATFORM }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +x
          if [ -n "${SSH_EMERGENT:-}" ] && [ -n "${SSH_GPU:-}" ]; then
            echo "credential_source=deploy_key" >> "$GITHUB_OUTPUT"
            if [ "${APP_OUTCOME}" = "success" ] && [ -n "${APP_TOKEN:-}" ]; then
              echo "token=${APP_TOKEN}" >> "$GITHUB_OUTPUT"
            elif [ -n "${PAT:-}" ]; then
              echo "token=${PAT}" >> "$GITHUB_OUTPUT"
            else
              echo "token=${GITHUB_TOKEN}" >> "$GITHUB_OUTPUT"
            fi
            echo "has_deploy_keys=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${APP_OUTCOME}" = "success" ] && [ -n "${APP_TOKEN:-}" ]; then
            echo "credential_source=github_app" >> "$GITHUB_OUTPUT"
            echo "token=${APP_TOKEN}" >> "$GITHUB_OUTPUT"
            echo "has_deploy_keys=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${PAT:-}" ]; then
            echo "credential_source=pat" >> "$GITHUB_OUTPUT"
            echo "token=${PAT}" >> "$GITHUB_OUTPUT"
            echo "has_deploy_keys=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: using PORTFOLIO_REPO_READ_TOKEN fallback (deploy keys preferred)"
            exit 0
          fi
          echo "credential_source=none" >> "$GITHUB_OUTPUT"
          echo "token=" >> "$GITHUB_OUTPUT"
          echo "has_deploy_keys=false" >> "$GITHUB_OUTPUT"
          echo "BLOCKED_CREDENTIAL_CONFIGURATION"
          echo "Configure PORTFOLIO_SSH_KEY_* deploy-key secrets (preferred) or PORTFOLIO_APP_ID + PORTFOLIO_APP_PRIVATE_KEY"
          echo "App mint outcome=${APP_OUTCOME}; do not fall back to interactive gh tokens"
          exit 3
        working-directory: .

      - name: Checkout locked sibling repositories
        env:
          PORTFOLIO_CHECKOUT_TOKEN: ${{ steps.creds.outputs.token }}
          PORTFOLIO_CREDENTIAL_SOURCE: ${{ steps.creds.outputs.credential_source }}
          PORTFOLIO_SSH_KEY_GUNNCHOS_EMERGENT_SERVICE_INTENT_PROTOCOLS: ${{ secrets.PORTFOLIO_SSH_KEY_GUNNCHOS_EMERGENT_SERVICE_INTENT_PROTOCOLS }}
          PORTFOLIO_SSH_KEY_GUNNCHOS_GPU_NR_BASEBAND_PLATFORM: ${{ secrets.PORTFOLIO_SSH_KEY_GUNNCHOS_GPU_NR_BASEBAND_PLATFORM }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/ci_checkout_locked_siblings.sh
          bash scripts/ci_checkout_locked_siblings.sh "$GITHUB_WORKSPACE"
        working-directory: gunnchos-7gc-ai-ran-field-kit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: .
        run: |
          python -m pip install -U pip
          python -m pip install jsonschema pytest pyyaml 'scipy>=1.11' 'numpy>=1.24'
          python -m pip install -r gunnchos-7gc-ai-ran-field-kit/requirements.txt
          python -m pip install -r edge-io-measurement-node/requirements.txt
          python -m pip install -r 7gc-digital-twin/requirements.txt
          python -m pip install -r ntn-resilience-sim/requirements.txt

      - name: Schema and failure tests
        run: |
          python -m pytest -q tests/contracts tests/failure_cases tests/provenance

      - name: Component contract tests
        working-directory: .
        run: |
          PYTHONPATH=src GATE2_CONTRACTS_DIR=$PWD/gunnchos-7gc-ai-ran-field-kit/contracts \
            pytest -q edge-io-measurement-node/tests/contracts || PYTHONPATH=edge-io-measurement-node/src GATE2_CONTRACTS_DIR=$PWD/gunnchos-7gc-ai-ran-field-kit/contracts pytest -q edge-io-measurement-node/tests/contracts
          PYTHONPATH=7gc-digital-twin/src GATE2_CONTRACTS_DIR=$PWD/gunnchos-7gc-ai-ran-field-kit/contracts pytest -q 7gc-digital-twin/tests/gate2
          PYTHONPATH=spectrumx-ai-ran-gary/src GATE2_CONTRACTS_DIR=$PWD/gunnchos-7gc-ai-ran-field-kit/contracts pytest -q spectrumx-ai-ran-gary/tests/gate2
          PYTHONPATH=ntn-resilience-sim/src GATE2_CONTRACTS_DIR=$PWD/gunnchos-7gc-ai-ran-field-kit/contracts pytest -q ntn-resilience-sim/tests/gate2

      - name: Integrated pipeline (strict)
        run: |
          # Refresh lock commits to checked-out SHAs for this CI matrix only (never commit).
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('..').resolve()
          lock_path = Path('integration/repo-lock.json')
          lock = json.loads(lock_path.read_text())
          for name, meta in lock['components'].items():
              repo = root / name
              if repo.is_dir():
                  sha = subprocess.check_output(['git','rev-parse','HEAD'], cwd=repo, text=True).strip()
                  meta['commit'] = sha
                  try:
                      meta['branch'] = subprocess.check_output(['git','branch','--show-current'], cwd=repo, text=True).strip()
                  except Exception:
                      meta['branch'] = meta.get('branch') or 'detached'
          lock_path.write_text(json.dumps(lock, indent=2)+'\n')
          PY
          python scripts/run_integrated_pipeline.py \
            --edge-input fixtures/valid/edge_measurement_batch.valid.json \
            --repos-root .. \
            --output-root results/integrated \
            --strict

      - name: Verify checksums and provenance
        run: |
          RUN_DIR=$(ls -d results/integrated/* | head -n 1)
          python scripts/verify_checksums.py "$RUN_DIR/checksums.sha256"
          python scripts/verify_provenance.py --run-dir "$RUN_DIR"
          python reproduction/verify_reproduction.py "$RUN_DIR"

      - name: Upload integrated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gate2-integrated-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: gunnchos-7gc-ai-ran-field-kit/results/integrated/
          overwrite: true

      - name: Summary
        run: |
          RUN_DIR=$(ls -d results/integrated/* | head -n 1)
          echo "## Gate 2 Integrated System" >> "$GITHUB_STEP_SUMMARY"
          python - <<PY
          import json, pathlib, os
          run = pathlib.Path(os.environ.get('RUN_DIR') or list(pathlib.Path('results/integrated').glob('*'))[0])
          gate = json.loads((run/'gate2_status.json').read_text())
          man = json.loads((run/'manifest.json').read_text())
          print(f"Status: **{gate['status']}**", file=open(os.environ['GITHUB_STEP_SUMMARY'],'a'))
          print(f"Run ID: `{man['run_id']}`", file=open(os.environ['GITHUB_STEP_SUMMARY'],'a'))
          print(f"Evidence: `{man['evidence_levels']}`", file=open(os.environ['GITHUB_STEP_SUMMARY'],'a'))
          PY
