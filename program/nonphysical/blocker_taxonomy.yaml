schema_version: "1.0.0"
nonphysical_work_classes:
  AUTOMATABLE_NOW: "Can be completed with current digital baselines"
  AUTOMATABLE_AFTER_DEPENDENCY: "Blocked only by another digital artifact"
  DIGITAL_DESIGN: "Schematic/PCB/CAD/DFM digital design"
  SIMULATION: "Models and sims clearly labeled SIMULATED/MODELED"
  SOFTWARE: "Application, OS, firmware source that builds"
  CI: "Workflows and gates that validate nonphysical work"
  TEST_HARNESS: "Unit/integration/emulator harnesses"
  EVIDENCE_COLLECTOR: "Collectors ready for later physical capture"
  FABRICATION_PACKAGE: "Gerbers, BOM, STEP/STL, fab notes"
  DOCUMENTATION: "Procedures, ICDs, manuals"
  ANALYSIS: "Budgets, risk, traceability"
  EXTERNAL_ENGAGEMENT_PREPARATION: "Packets for partners/labs/carriers without claiming acceptance"
  STANDARDS_MAPPING_CURRENT_STATE: "Live mapping without claiming final conformance"

irreducible_blocker_classes:
  REQUIRES_LOCAL_HARDWARE: "Needs attached device or lab instrument"
  REQUIRES_PHYSICAL_PROTOTYPE: "Needs built enclosure/ring/board"
  REQUIRES_PHYSICAL_FABRICATION: "Needs fab/assembly house run"
  REQUIRES_HUMAN_PARTICIPANTS: "Needs real users/reviewers"
  REQUIRES_EDMUND_ACCEPTANCE: "Founder acceptance decision"
  REQUIRES_ETHICS_OR_GOVERNANCE_APPROVAL: "IRB/ethics/community governance"
  REQUIRES_EXTERNAL_PARTNER: "Partner organization action"
  REQUIRES_CARRIER: "Carrier engagement/acceptance"
  REQUIRES_MANUFACTURER: "CM/supplier production action"
  REQUIRES_CERTIFICATION_LAB: "Accredited lab testing"
  REQUIRES_STANDARD_FINALIZATION: "Normative standard not yet approved"
  REQUIRES_PURCHASE: "Procurement of parts/equipment"
